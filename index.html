<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#202020">
  <meta name="description" content="把一首喜欢的曲子，慢慢弹会。为 iPad 准备的 MIDI 钢琴练习室。">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Meedee</title>
  <link rel="icon" href="./assets/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./style.css">
  <script src="./vendor/Midi.js" defer></script>
  <script src="./src/app.js" type="module"></script>
</head>
<body>
  <svg class="icon-defs" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs>
    <symbol id="i-piano" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16m6-16v16M7 4v8m6-8v8m6-8v8"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="m9 5 11 7-11 7z"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="m11 6-6 6 6 6m7-12-6 6 6 6"/></symbol>
    <symbol id="i-forward" viewBox="0 0 24 24"><path d="m6 6 6 6-6 6m7-12 6 6-6 6"/></symbol>
    <symbol id="i-restart" viewBox="0 0 24 24"><path d="M4 4v6h6M5 9a8 8 0 1 1-1 7"/></symbol>
    <symbol id="i-loop" viewBox="0 0 24 24"><path d="m17 2 4 4-4 4M3 11V8a2 2 0 0 1 2-2h16M7 22l-4-4 4-4m14-3v5a2 2 0 0 1-2 2H3"/></symbol>
    <symbol id="i-import" viewBox="0 0 24 24"><path d="M12 15V3m-4 4 4-4 4 4M4 14v5a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-5"/></symbol>
    <symbol id="i-fullscreen" viewBox="0 0 24 24"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m8 0h5v-5"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 7h16M4 17h16M9 4v6m6 4v6"/></symbol>
    <symbol id="i-volume" viewBox="0 0 24 24"><path d="M11 4 6 8H3v8h3l5 4zM15 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"/></symbol>
    <symbol id="i-book" viewBox="0 0 24 24"><path d="M12 5C8 2 3 4 3 4v15s5-2 9 1c4-3 9-1 9-1V4s-5-2-9 1v15"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
  </defs></svg>


  <div class="app-shell">
    <header class="app-header">
      <div class="current-song"><h1 id="song-title">Canon in D</h1><span id="song-subtitle"></span></div>
      <div class="header-actions">
        <button id="library-button" class="text-button">曲目</button>
        <button id="settings-button" class="icon-button" aria-label="设置" title="设置"><svg><use href="#i-settings"/></svg></button>
        <button id="fullscreen-button" class="icon-button" aria-label="全屏" title="全屏"><svg><use href="#i-fullscreen"/></svg></button>
      </div>
    </header>
    <main class="practice">
      <div class="roll-panel"><div class="canvas-wrap" id="canvas-wrap">
        <canvas id="piano-roll" aria-label="钢琴音符与琴键"></canvas>
        <div class="roll-empty" id="roll-empty">正在载入…</div>
        <div class="countdown" id="countdown" hidden><span id="countdown-number">3</span></div>
      </div></div>
      <section class="player" aria-label="播放控制">
        <div class="timeline-row"><output id="current-time">0:00</output><div class="timeline-wrap"><div id="timeline-progress" class="timeline-progress"></div><div id="loop-selection" class="loop-selection" hidden><span>A</span><span>B</span></div><input id="seek" type="range" min="0" max="200" value="0" step="0.01" aria-label="播放进度"></div><output id="total-time">0:00</output></div>
        <div class="controls">
          <div class="transport-buttons">
            <button class="icon-button" id="restart-button" aria-label="从头开始" title="从头开始"><svg><use href="#i-restart"/></svg></button>
            <button class="icon-button" id="back-button" aria-label="后退 5 秒" title="后退 5 秒"><svg><use href="#i-back"/></svg></button>
            <button class="play-button" id="play-button" aria-label="播放" disabled><svg id="play-icon"><use href="#i-play"/></svg><span class="sr-only" id="play-text">播放</span></button>
            <button class="icon-button" id="forward-button" aria-label="前进 5 秒" title="前进 5 秒"><svg><use href="#i-forward"/></svg></button>
            <button class="icon-button loop-settings-button" id="loop-settings-button" aria-label="片段循环" title="片段循环"><svg><use href="#i-loop"/></svg></button>
          </div>
          <label class="speed-control"><span>速度</span><input id="speed" type="range" min="0.25" max="1.5" step="0.05" value="1" aria-label="播放速度"><output id="speed-label">1.00×</output></label>
          <div class="transpose-control"><button id="transpose-down" class="small-step" aria-label="降低一个半音">−</button><output id="transpose-label" aria-label="当前调性">D 大调</output><button id="transpose-up" class="small-step" aria-label="升高一个半音">＋</button></div>
        </div>
      </section>
    </main>
  </div>
  <input id="midi-file" type="file" accept=".mid,.midi,audio/midi,audio/x-midi" hidden>
  <dialog id="loop-dialog" class="settings-dialog">
    <div class="dialog-heading"><h2>片段循环</h2><button class="icon-button" data-close aria-label="关闭"><svg><use href="#i-close"/></svg></button></div>
    <div class="loop-bar-inputs"><label>起始小节<input id="loop-start-bar" type="number" min="1" value="1" inputmode="numeric"></label><span>—</span><label>结束小节（含）<input id="loop-end-bar" type="number" min="1" value="4" inputmode="numeric"></label></div>
    <div class="loop-exact"><button id="set-a" class="outline-button">当前位置设为 A</button><button id="set-b" class="outline-button">当前位置设为 B</button></div>
    <p class="loop-time" id="loop-time"></p>
    <div class="dialog-actions"><button id="clear-loop" class="outline-button">关闭循环</button><button id="apply-loop" class="primary-button">应用</button></div>
  </dialog>
  <dialog id="settings-dialog" class="settings-dialog">
    <div class="dialog-heading"><h2>设置</h2><button class="icon-button" data-close aria-label="关闭"><svg><use href="#i-close"/></svg></button></div>
    <label class="setting-row"><span>音量</span><input id="volume" type="range" min="0" max="1" step="0.01" value="0.75" aria-label="音量"></label>
    <label class="setting-row"><span>显示音名</span><input id="note-labels" type="checkbox" checked></label>
    <label class="setting-row"><span>从头播放时预备 3 秒</span><input id="count-in" type="checkbox" checked></label>
    <label class="setting-row"><span>预览长度</span><select id="lookahead"><option value="6">6 秒</option><option value="9">9 秒</option><option value="12">12 秒</option><option value="16">16 秒</option></select></label>
    <div class="setting-row"><span>键盘范围</span><button id="range-button" class="outline-button" aria-label="切换到完整 88 键键盘">适配曲目</button></div>
    <label class="setting-row"><span>左右手分配<small id="hand-method-note">按 MIDI 声部分配颜色</small></span><select id="hand-method"><option value="auto">跟随声部</option><option value="pitch">按音高分手</option></select></label>
    <label class="setting-row" id="split-row" hidden><span>分界音</span><select id="split-note"><option value="48">C3</option><option value="55">G3</option><option value="60">C4</option><option value="65">F4</option><option value="72">C5</option></select></label>
    <div class="setting-row"><span>移调</span><button id="transpose-reset" class="outline-button">恢复原调</button></div>
  </dialog>
  <dialog id="library-dialog" class="settings-dialog">
    <div class="dialog-heading"><h2>曲目</h2><button class="icon-button" data-close aria-label="关闭"><svg><use href="#i-close"/></svg></button></div>
    <div id="song-list" class="song-list"></div>
    <button class="outline-button import-button" data-import><svg><use href="#i-import"/></svg>导入 MIDI</button>
  </dialog>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
